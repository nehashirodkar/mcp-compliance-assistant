<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1200" height="470" fill="#ffffff"/>

  <!-- containers -->
  <rect x="245" y="40" width="340" height="212" rx="10" fill="#faf8ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="259" y="62" font-size="13" font-weight="700" fill="#111111">LangGraph Agent — Claude Sonnet 4.6</text>

  <rect x="625" y="40" width="315" height="212" rx="10" fill="#f5fbfc" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="639" y="62" font-size="13" font-weight="700" fill="#111111">MCP Server</text>

  <!-- IO -->
  <rect x="28" y="72" width="178" height="46" rx="8" fill="#e4defb" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="117" y="100" font-size="13.5" font-weight="600" fill="#111111" text-anchor="middle">User / Compliance Q</text>
  <rect x="28" y="150" width="178" height="46" rx="8" fill="#e4defb" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="117" y="178" font-size="13.5" font-weight="600" fill="#111111" text-anchor="middle">Single-page demo</text>

  <!-- agent inner -->
  <rect x="268" y="72" width="135" height="46" rx="8" fill="#ece7fc" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="335" y="100" font-size="13.5" font-weight="600" fill="#111111" text-anchor="middle">ReAct loop</text>
  <rect x="420" y="72" width="130" height="46" rx="8" fill="#ece7fc" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="485" y="100" font-size="13.5" font-weight="600" fill="#111111" text-anchor="middle">Retry guard</text>
  <rect x="285" y="166" width="270" height="44" rx="8" fill="#fbe6fb" stroke="#a21caf" stroke-width="1.4"/>
  <text x="420" y="193" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">Session + vector memory</text>

  <!-- server inner -->
  <rect x="640" y="72" width="282" height="42" rx="8" fill="#dcf2f6" stroke="#0e7490" stroke-width="1.4"/>
  <text x="781" y="98" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">regulatory_clause_lookup</text>
  <rect x="640" y="124" width="282" height="42" rx="8" fill="#dcf2f6" stroke="#0e7490" stroke-width="1.4"/>
  <text x="781" y="150" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">compliance_risk_score</text>
  <rect x="640" y="184" width="282" height="44" rx="8" fill="#dcf2f6" stroke="#0e7490" stroke-width="1.4"/>
  <text x="781" y="211" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">resolve_entity</text>

  <!-- stores -->
  <rect x="985" y="62" width="195" height="62" rx="8" fill="#fbe6fb" stroke="#a21caf" stroke-width="1.4"/>
  <text x="1082" y="86" font-size="12.5" font-weight="600" fill="#111111" text-anchor="middle">Chroma — local embeddings</text>
  <text x="1082" y="105" font-size="12" fill="#111111" text-anchor="middle">BSA / CIP / OFAC / FATF</text>
  <rect x="985" y="160" width="195" height="56" rx="8" fill="#fbe6fb" stroke="#a21caf" stroke-width="1.4"/>
  <text x="1082" y="184" font-size="12.5" font-weight="600" fill="#111111" text-anchor="middle">AML entity /</text>
  <text x="1082" y="202" font-size="12.5" font-weight="600" fill="#111111" text-anchor="middle">watchlist table</text>

  <!-- escalation -->
  <rect x="268" y="300" width="180" height="52" rx="8" fill="#fdeeb5" stroke="#a16207" stroke-width="1.4"/>
  <text x="358" y="330" font-size="13.5" font-weight="600" fill="#111111" text-anchor="middle">Escalation policy</text>
  <rect x="545" y="296" width="265" height="60" rx="8" fill="#fbd7d7" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="677" y="320" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">FastAPI HITL webhook</text>
  <text x="677" y="339" font-size="11.5" fill="#111111" text-anchor="middle">API-key · rate-limit · req-id</text>
  <rect x="865" y="306" width="185" height="46" rx="8" fill="#fbe6fb" stroke="#a21caf" stroke-width="1.4"/>
  <text x="957" y="334" font-size="12.5" font-weight="600" fill="#111111" text-anchor="middle">Append-only audit log</text>
  <rect x="545" y="390" width="170" height="46" rx="8" fill="#d3edd3" stroke="#15803d" stroke-width="1.4"/>
  <text x="630" y="418" font-size="13.5" font-weight="600" fill="#111111" text-anchor="middle">Auto-cleared</text>

  <!-- edges (orthogonal) -->
  <g stroke="#555555" stroke-width="1.5" fill="none">
    <path d="M206 88 H236 V88 H268" marker-end="url(#arr)"/>
    <path d="M206 173 H236 V104 H268" marker-end="url(#arr)"/>
    <path d="M403 95 H420" marker-end="url(#arr)"/>
    <path d="M550 95 H640" marker-end="url(#arr)"/>
    <path d="M781 166 V184" marker-end="url(#arr)"/>
    <path d="M922 93 H985" marker-end="url(#arr)"/>
    <path d="M922 206 H955 V188 H985" marker-end="url(#arr)"/>
    <path d="M358 252 V300" marker-end="url(#arr)"/>
    <path d="M448 326 H545" marker-end="url(#arr)"/>
    <path d="M358 352 V413 H545" marker-end="url(#arr)"/>
    <path d="M810 326 H865" marker-end="url(#arr)"/>
  </g>

  <!-- edge labels (white background for legibility) -->
  <g font-size="11.5" fill="#111111">
    <rect x="560" y="80" width="70" height="17" fill="#ffffff"/><text x="563" y="92">stdio / MCP</text>
    <rect x="788" y="167" width="108" height="17" fill="#ffffff"/><text x="791" y="179">resolves internally</text>
    <rect x="364" y="266" width="58" height="17" fill="#ffffff"/><text x="367" y="278">risk score</text>
    <rect x="452" y="309" width="140" height="17" fill="#ffffff"/><text x="455" y="321">sanctioned / PEP / HIGH</text>
    <rect x="372" y="392" width="40" height="17" fill="#ffffff"/><text x="375" y="404">clean</text>
  </g>
</svg>
